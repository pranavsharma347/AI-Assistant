version: 0.2

phases:
  install:
    runtime-versions:
      python: 3.9
    commands:
      - echo "Installing dependencies..."
      - pip install --upgrade pip
      - pip install -r requirements.txt -t ./package

  build:
    commands:
      - echo "Running Django collectstatic..."
      - python3 manage.py collectstatic --noinput || echo "No static files found"
      - echo "Build completed successfully."

artifacts:
  files:
    - '**/*'
  discard-paths: no
